<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <header class="homey-header">
    <h1 class="homey-title">Enter your Telegram API details</h1>
    <p class="homey-subtitle">Copy these values from my.telegram.org → API development tools.</p>
  </header>
  <form id="form" class="homey-form">
    <div class="homey-form-group">
      <label class="homey-form-label" for="api-id">Telegram API ID</label>
      <input class="homey-form-input" id="api-id" type="text" inputmode="numeric" autocomplete="off" placeholder="A number" required>
    </div>
    <div class="homey-form-group">
      <label class="homey-form-label" for="api-hash">Telegram API hash</label>
      <input class="homey-form-input" id="api-hash" type="password" autocomplete="off" placeholder="32 characters" required>
    </div>
    <button class="homey-button-primary-full" id="continue" type="submit">Continue</button>
    <p id="status" role="status"></p>
  </form>
  <script>
    (function () {
    const form = document.getElementById('form');
    const apiId = document.getElementById('api-id');
    const apiHash = document.getElementById('api-hash');
    const button = document.getElementById('continue');
    const status = document.getElementById('status');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      status.textContent = 'Checking API details…';
      try {
        const result = await Homey.emit('submit_telegram_credentials', {
          apiId: apiId.value.trim(),
          apiHash: apiHash.value.trim(),
        });
        if (!result?.ok) throw new Error(result?.error || 'Check the API ID and hash, then try again.');
        await Homey.showView('telegram_qr');
      } catch (error) {
        status.textContent = error?.message || 'Check the API ID and hash, then try again.';
        button.disabled = false;
      }
    });
    })();
  </script>
</body>
</html>
