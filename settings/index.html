<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/homey.js" data-origin="settings"></script>
</head>
<body>
  <header class="homey-header">
    <h1 class="homey-title">Google Play Sales</h1>
    <p class="homey-subtitle">Paste the connection copied by the Telegram sign-in script.</p>
  </header>
  <form id="setup" class="homey-form">
    <div class="homey-form-group">
      <label class="homey-form-label" for="connection">Telegram connection</label>
      <input class="homey-form-input" id="connection" type="password" autocomplete="off" required>
    </div>
    <button class="homey-button-primary-full" type="submit">Save connection</button>
    <button class="homey-button-secondary-full" type="button" id="disconnect">Remove connection</button>
    <p id="status" role="status"></p>
  </form>
  <script>
    function onHomeyReady(Homey) {
      const connection = document.getElementById('connection');
      const status = document.getElementById('status');
      document.getElementById('setup').addEventListener('submit', (event) => {
        event.preventDefault();
        let config;
        try {
          config = JSON.parse(connection.value);
          if (!Number.isSafeInteger(config.apiId) || config.apiId <= 0 ||
              !/^[a-f0-9]{32}$/i.test(config.apiHash) ||
              !/^@[A-Za-z0-9_]{5,32}$/.test(config.bot) ||
              typeof config.session !== 'string' || !config.session) throw new Error();
        } catch {
          status.textContent = 'Paste the connection copied by the sign-in script.';
          return;
        }
        const { apiId, apiHash, bot, session } = config;
        Homey.set('telegram', { apiId, apiHash, bot, session }, (error) => {
          status.textContent = error ? 'Couldn’t save the connection.' : 'Connection saved.';
          if (!error) connection.value = '';
        });
      });
      document.getElementById('disconnect').addEventListener('click', () => {
        Homey.unset('telegram', (error) => {
          status.textContent = error ? 'Couldn’t remove the connection.' : 'Connection removed.';
        });
      });
      Homey.ready();
    }
  </script>
</body>
</html>
